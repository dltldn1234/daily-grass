name: Daily check-in

on:
  schedule:
    - cron: '37 12 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions: {}

jobs:
  check-in:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: daily-checkin-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
      - name: Record and push today's check-in
        env:
          GIT_AUTHOR_NAME: dltldn1234
          GIT_AUTHOR_EMAIL: 266720604+dltldn1234@users.noreply.github.com
        run: ./scripts/checkin.sh
